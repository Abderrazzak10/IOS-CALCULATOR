<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOS CALCULATOR</title>
    <!-- Add CSS styles for the calculator interface -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Add the calculator container -->
    <div class="container">
        <!-- Add the output display -->
        <div class="output">
            <span>0</span>
        </div>

        <!-- Add the buttons container -->
        <div class="buttons">
            <!-- Add the clear button -->
            <button>AC</button>

            <!-- Add the toggle-sign button -->
            <button>+/-</button>

            <!-- Add the percentage button -->
            <button>%</button>

            <!-- Add the divide operator button -->
            <button>÷</button>

            <!-- Add the number buttons -->
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>x</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
            <button>0</button>
            <button>.</button>

            <!-- Add the equals button -->
            <button>=</button>
        </div>
    </div>
</body>
</html>
