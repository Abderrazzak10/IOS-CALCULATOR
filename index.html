<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOS CALCULATOR</title>
    <!-- Add CSS styles for the calculator interface -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Add the calculator container -->
    <div class="container">
        <!-- Add the output display -->
        <div class="output" id="output">
            <span>0</span>
        </div>

        <!-- Add the buttons container -->
        <div class="buttons">
            <!-- Add the clear button -->
            <button onclick="clearOutput()" data-action="clear">AC</button>

            <!-- Add the toggle-sign button -->
            <button onclick="toggleSign()" data-action="toggle-sign">+/-</button>

            <!-- Add the percentage button -->
            <button data-action="percentage">%</button>

            <!-- Add the divide operator button -->
            <button data-action="divide" class="operator-button">÷</button>

            <!-- Add the number buttons -->
            <button data-action="number">7</button>
            <button data-action="number">8</button>
            <button data-action="number">9</button>
            <button class="operator-button">x</button>
            <button data-action="number">4</button>
            <button data-action="number">5</button>
            <button data-action="number">6</button>
            <button class="operator-button">-</button>
            <button data-action="number">1</button>
            <button data-action="number">2</button>
            <button data-action="number">3</button>
            <button class="operator-button">+</button>
            <button class="double-wide-button rectangular-button" data-action="number">0</button>
            <button data-action="number">.</button>

            <!-- Add the equals button -->
            <button onclick="calculate()" class="equals-button">=</button>
        </div>
    </div>

    <!-- Add the JavaScript file for the calculator functionality -->
    <script src="js/script.js"></script>
</body>
</html>
